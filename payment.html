<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата заказа - Velvet</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .payment-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
        }
        .inn-info {
            background: #f9f0ff;
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
        }
        .inn-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 2px;
        }
        .payment-status {
            margin-top: 30px;
            padding: 20px;
            border-radius: 16px;
        }
        .status-success {
            background: #e6f7e6;
            color: #4caf50;
        }
        .status-error {
            background: #ffe6e6;
            color: #ff4757;
        }
        .status-pending {
            background: #fff3e6;
            color: #ff9800;
        }
        .order-details {
            text-align: left;
            margin: 20px 0;
            padding: 20px;
            background: #fafafa;
            border-radius: 16px;
        }
        #payment-form {
            margin: 20px 0;
            min-width: 288px;
        }
        .hidden {
            display: none;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<header>
    <div class="container">
        <div class="header-content">
            <div class="logo-wrapper">
                <span class="logo-text">Velvet</span>
            </div>
            <button onclick="window.location.href='index.html'" class="btn" style="background:#ccc">← На главную</button>
        </div>
    </div>
</header>

<main class="payment-container">
    <h1>💳 Оплата заказа</h1>
    
    <div class="order-details" id="order-details">
        <p><strong>Номер заказа:</strong> <span id="order-id">—</span></p>
        <p><strong>Сумма к оплате:</strong> <span id="order-amount" style="font-size: 24px; font-weight: 700; color: var(--primary);">0 ₽</span></p>
    </div>

    <div class="inn-info">
        <p style="margin-bottom: 8px;">💰 Платёж поступает самозанятому:</p>
        <div class="inn-number">ИНН: 742309018202</div>
        <p style="font-size: 12px; margin-top: 8px; color: #666;">Чек отправляется на email после оплаты</p>
    </div>

    <div id="payment-form"></div>

    <div id="payment-status" class="payment-status status-pending hidden">
        ⏳ Ожидание оплаты...
    </div>

    <div id="loader" class="loader hidden"></div>
    
    <button class="btn" onclick="window.location.href='profile.html'" style="margin-top: 16px; background: #ccc;">📦 Перейти к заказам</button>
</main>

<script src="https://yookassa.ru/checkout-widget/v1/checkout-widget.js"></script>

<script>
    const API_BASE = 'https://velvet-cakes-api.onrender.com/api';
    
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    
    let checkoutWidget = null;
    
    console.log('Payment page loaded, orderId:', orderId);
    
    if (typeof window.YooMoneyCheckoutWidget === 'undefined') {
        console.error('YooMoneyCheckoutWidget not loaded!');
        document.getElementById('payment-status').innerHTML = 
            '<div class="status-error">❌ Не удалось загрузить платежный виджет. Проверьте интернет-соединение.</div>';
        document.getElementById('payment-status').classList.remove('hidden');
    } else {
        console.log('YooMoneyCheckoutWidget loaded successfully');
    }
    
    async function loadOrderInfo() {
        if (!orderId) {
            document.getElementById('order-id').textContent = 'Не указан';
            showError('❌ Не указан номер заказа');
            return;
        }
        
        document.getElementById('order-id').textContent = orderId;
        
        try {
            const token = localStorage.getItem('authToken');
            if (!token) {
                showError('❌ Вы не авторизованы. <a href="index.html?auth=login" style="color: var(--primary);">Войдите</a>');
                return;
            }
            
            const response = await fetch(`${API_BASE}/orders/my`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const orders = await response.json();
            const order = orders.find(o => o.id == orderId);
            
            if (order) {
                document.getElementById('order-amount').textContent = `${order.totalAmount} ₽`;
                
                if (order.status !== 'Ожидает оплаты') {
                    showSuccess('✅ Заказ уже обработан или оплачен!');
                    return;
                }
                
                await createPaymentAndShowWidget(order.totalAmount);
            } else {
                showError('❌ Заказ не найден');
            }
        } catch(e) {
            console.error('Error loading order:', e);
            showError('❌ Ошибка загрузки заказа');
        }
    }
    
    async function createPaymentAndShowWidget(amount) {
        const token = localStorage.getItem('authToken');
        
        if (!token) {
            showError('❌ Вы не авторизованы');
            return;
        }
        
        try {
            document.getElementById('loader').classList.remove('hidden');
            
            const returnUrl = `${window.location.origin}/payment.html?orderId=${orderId}&status=success`;
            
            console.log('Creating payment for order:', orderId);
            console.log('Return URL:', returnUrl);
            
            const response = await fetch(`${API_BASE}/orders/${orderId}/payment`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ returnUrl: returnUrl })
            });
            
            const data = await response.json();
            console.log('Payment response:', data);
            
            document.getElementById('loader').classList.add('hidden');
            
            if (response.ok && data.confirmationToken) {
                initWidget(data.confirmationToken);
            } else {
                throw new Error(data.error || data.message || 'Ошибка создания платежа');
            }
        } catch(e) {
            console.error('Payment error:', e);
            document.getElementById('loader').classList.add('hidden');
            showError('❌ Ошибка: ' + e.message);
        }
    }
    
    function initWidget(confirmationToken) {
        console.log('Initializing widget with token:', confirmationToken);
        
        const returnUrl = `${window.location.origin}/payment.html?orderId=${orderId}&status=success`;
        
        try {
            checkoutWidget = new window.YooMoneyCheckoutWidget({
                confirmation_token: confirmationToken,
                return_url: returnUrl,
                error_callback: function(error) {
                    console.error('Widget error:', error);
                    showError('Ошибка виджета: ' + JSON.stringify(error));
                }
            });
            
            checkoutWidget.render('payment-form')
                .then(() => {
                    console.log('Widget rendered successfully');
                    document.getElementById('payment-status').classList.remove('hidden');
                    document.getElementById('payment-status').innerHTML = '💳 Выберите способ оплаты и введите данные карты';
                    document.getElementById('payment-status').className = 'payment-status status-pending';
                })
                .catch(error => {
                    console.error('Widget render error:', error);
                    showError('Ошибка отображения платежной формы');
                });
        } catch(e) {
            console.error('Widget initialization error:', e);
            showError('Ошибка инициализации виджета: ' + e.message);
        }
    }
    
    function showError(message) {
        const statusDiv = document.getElementById('payment-status');
        statusDiv.innerHTML = message;
        statusDiv.className = 'payment-status status-error';
        statusDiv.classList.remove('hidden');
    }
    
    function showSuccess(message) {
        const statusDiv = document.getElementById('payment-status');
        statusDiv.innerHTML = message;
        statusDiv.className = 'payment-status status-success';
        statusDiv.classList.remove('hidden');
    }
    
    const statusParam = urlParams.get('status');
    if (statusParam === 'success') {
        showSuccess('✅ Оплата успешно произведена! Спасибо за заказ!');
        const pendingCart = localStorage.getItem('pendingCart');
        if (pendingCart) {
            localStorage.setItem('cart', '[]');
            localStorage.removeItem('pendingCart');
            localStorage.removeItem('pendingOrderId');
        }
    } else {
        loadOrderInfo();
    }
</script>
</body>
</html>
