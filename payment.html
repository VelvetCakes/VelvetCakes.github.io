<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата заказа - Velvet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .payment-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .payment-container h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 28px;
        }
        .order-summary {
            background: #f9f0ff;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }
        .order-summary h3 {
            margin-bottom: 16px;
            color: var(--primary);
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .order-total {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid var(--primary);
            font-weight: bold;
            font-size: 18px;
        }
        .payment-form-container {
            margin-top: 20px;
        }
        .btn-back {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 20px;
            background: #ccc;
            color: #333;
        }
        .btn-back:hover {
            background: #bbb;
        }
        .success-message {
            background: #e6f7e6;
            color: #4caf50;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .error-message {
            background: #ffe6e6;
            color: #ff4757;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .loader {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
<header>
    <div class="container">
        <div class="header-content">
            <div class="logo-wrapper">
                <span class="logo-text">Velvet</span>
            </div>
            <button onclick="window.location.href='index.html'" class="btn" style="background:#ccc">← На главную</button>
        </div>
    </div>
</header>

<main class="payment-container" id="payment-container">
    <div id="loader" class="loader">
        <div class="loading-spinner" style="border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
        <p>Загрузка информации о заказе...</p>
    </div>
    <div id="payment-content" style="display: none;"></div>
</main>

<style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    const API_BASE = 'https://velvet-cakes-api.onrender.com/api';
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    const status = urlParams.get('status');
    const paymentId = urlParams.get('paymentId');

    function escapeHtml(text) {
        if (!text) return '';
        return String(text).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function checkPaymentStatus() {
        if (!orderId) return false;
        
        const token = localStorage.getItem('authToken');
        if (!token) return false;
        
        try {
            const response = await fetch(`${API_BASE}/orders/my`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const orders = await response.json();
            const order = orders.find(function(o) { return o.id == orderId; });
            
            if (order) {
                console.log('Order status:', order.status);
                console.log('Paid amount:', order.paidAmount);
                
                if (order.status !== 'Ожидает оплаты') {
                    localStorage.removeItem('pendingOrderData');
                    localStorage.removeItem('pendingCart');
                    localStorage.removeItem('pendingOrderId');
                    localStorage.setItem('cart', '[]');
                    return true;
                }
            }
            return false;
        } catch(e) {
            console.error('Error checking payment status:', e);
            return false;
        }
    }
    
    if (status === 'success' || paymentId) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('payment-content').style.display = 'block';
        document.getElementById('payment-content').innerHTML = `
            <div class="success-message">
                ✅ Оплата успешно произведена!<br>
                Спасибо за ваш заказ!
            </div>
            <div style="text-align: center; margin: 20px 0;">
                <div id="status-check-text">⏳ Проверка статуса заказа...</div>
            </div>
            <button class="btn" onclick="window.location.href='profile.html'" style="width: 100%;">📦 Перейти к заказам</button>
            <a href="index.html" class="btn btn-back" style="display: block; text-align: center; margin-top: 16px; background: #ccc; color: #333; text-decoration: none; padding: 10px; border-radius: 40px;">← На главную</a>
        `;
        
        var attempts = 0;
        var maxAttempts = 15;
        var statusCheckInterval = setInterval(async function() {
            attempts++;
            var statusText = document.getElementById('status-check-text');
            var isPaid = await checkPaymentStatus();
            
            if (isPaid) {
                clearInterval(statusCheckInterval);
                if (statusText) {
                    statusText.innerHTML = '✅ Заказ оплачен и передан в работу!';
                    statusText.style.color = '#4caf50';
                }
            } else if (attempts >= maxAttempts) {
                clearInterval(statusCheckInterval);
                if (statusText) {
                    statusText.innerHTML = '⏳ Оплата обрабатывается. Проверьте статус заказа в личном кабинете.';
                    statusText.style.color = '#ff9800';
                }
            } else {
                if (statusText) {
                    statusText.innerHTML = '⏳ Проверка статуса оплаты... (' + attempts + '/' + maxAttempts + ')';
                }
            }
        }, 3000);
    } 
    else {
        loadOrderAndShowPayment();
    }
    
    async function loadOrderAndShowPayment() {
        if (!orderId) {
            showError('❌ Не указан номер заказа');
            return;
        }
        
        var token = localStorage.getItem('authToken');
        if (!token) {
            showError('❌ Вы не авторизованы. <a href="index.html?auth=login" style="color: var(--primary);">Войдите</a>');
            return;
        }
        
        try {
            var response = await fetch(API_BASE + '/orders/my', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            if (!response.ok) throw new Error('Ошибка загрузки заказа');
            
            var orders = await response.json();
            var order = orders.find(function(o) { return o.id == orderId; });
            
            if (!order) {
                showError('❌ Заказ не найден');
                return;
            }
            
            if (order.status !== 'Ожидает оплаты') {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('payment-content').style.display = 'block';
                document.getElementById('payment-content').innerHTML = `
                    <div class="success-message">
                        ✅ Заказ уже обработан или оплачен!<br>
                        Текущий статус: ${order.status}
                    </div>
                    <button class="btn" onclick="window.location.href='profile.html'" style="width: 100%;">📦 Перейти к заказам</button>
                    <a href="index.html" class="btn btn-back" style="display: block; text-align: center; margin-top: 16px; background: #ccc; color: #333; text-decoration: none; padding: 10px; border-radius: 40px;">← На главную</a>
                `;
                return;
            }
            
            var cartItems = JSON.parse(localStorage.getItem('pendingCart') || '[]');
            displayPaymentForm(order, cartItems);
            
        } catch(e) {
            console.error('Error:', e);
            showError('❌ Ошибка загрузки информации о заказе');
        }
    }
    
    function displayPaymentForm(order, cartItems) {
        document.getElementById('loader').style.display = 'none';
        var container = document.getElementById('payment-content');
        container.style.display = 'block';
        
        var productsHtml = '';
        
        if (cartItems.length > 0) {
            cartItems.forEach(function(item) {
                var qty = item.quantity || 1;
                var price = item.price || 0;
                productsHtml += `
                    <div class="ym-product">
                        <div class="ym-product-line">
                            <span class="ym-product-description">${escapeHtml(item.name)}</span>
                            <span class="ym-product-price" data-price="${price}" data-count="${qty}">${(price * qty).toFixed(2)}&nbsp;₽</span>
                        </div>
                        <div class="ym-product-line ym-align-items-center">
                            <span class="ym-label-text">Количество</span>
                            <div class="ym-count-input">
                                <input class="ym-input" value="${qty}" type="number" step="any" readonly disabled>
                            </div>
                        </div>
                        <input type="hidden" name="text" value="${escapeHtml(item.name)}">
                        <input type="hidden" name="price" value="${price}">
                        <input type="hidden" name="quantity" value="${qty}">
                        <input type="hidden" name="paymentSubjectType" value="commodity">
                        <input type="hidden" name="paymentMethodType" value="full_payment">
                        <input type="hidden" name="tax" value="1">
                    </div>
                `;
            });
        } else {
            productsHtml = `
                <div class="ym-product">
                    <div class="ym-product-line">
                        <span class="ym-product-description">Заказ #${order.id}</span>
                        <span class="ym-product-price" data-price="${order.totalAmount}" data-count="1">${order.totalAmount.toFixed(2)}&nbsp;₽</span>
                    </div>
                    <div class="ym-product-line ym-align-items-center">
                        <span class="ym-label-text">Количество</span>
                        <div class="ym-count-input">
                            <input class="ym-input" value="1" type="number" step="any" readonly disabled>
                        </div>
                    </div>
                    <input type="hidden" name="text" value="Заказ #${order.id}">
                    <input type="hidden" name="price" value="${order.totalAmount}">
                    <input type="hidden" name="quantity" value="1">
                    <input type="hidden" name="paymentSubjectType" value="commodity">
                    <input type="hidden" name="paymentMethodType" value="full_payment">
                    <input type="hidden" name="tax" value="1">
                </div>
            `;
        }
        
        var user = JSON.parse(localStorage.getItem('user') || '{}');
        var userEmail = user.Email || user.email || '';
        
        container.innerHTML = `
            <h1>💳 Оплата заказа</h1>
            <div class="order-summary">
                <h3>Детали заказа</h3>
                <div><strong>Номер заказа:</strong> #${order.id}</div>
                <div><strong>Сумма к оплате:</strong> <span style="font-size: 24px; font-weight: 700; color: var(--primary);">${order.totalAmount} ₽</span></div>
                <div><strong>Дата получения:</strong> ${order.desiredDeliveryDate || '—'}</div>
            </div>
            
            <div class="payment-form-container">
                <link rel="stylesheet" href="https://yookassa.ru/integration/simplepay/css/yookassa_construct_form.css?v=1.34.0">
                <form class="yoomoney-payment-form" action="https://yookassa.ru/integration/simplepay/payment" method="post" accept-charset="utf-8">
                    
                    <div class="ym-products">
                        <div class="ym-block-title ym-products-title">Товары</div>
                        ${productsHtml}
                    </div>
                    <input value="" type="hidden" name="ym_merchant_receipt">
                    
                    <div class="ym-customer-info">
                        <div class="ym-block-title">О покупателе</div>
                        <input name="cps_email" class="ym-input" placeholder="Email" type="email" value="${escapeHtml(userEmail)}" required>
                    </div>
                    
                    <div class="ym-hidden-inputs">
                        <input type="hidden" name="shopId" value="1362658">
                        <input type="hidden" name="paymentType" value="AC">
                    </div>
                    
                    <div class="ym-payment-btn-block ym-before-line ym-align-space-between">
                        <div class="ym-input-icon-rub ym-display-none">
                            <input name="sum" placeholder="0.00" class="ym-input ym-sum-input ym-required-input" type="number" step="any" value="${order.totalAmount}">
                        </div>
                        <button data-text="Оплатить" class="ym-btn-pay ym-result-price">
                            <span class="ym-text-crop">Оплатить</span>
                            <span class="ym-price-output">${order.totalAmount.toFixed(2)}&nbsp;₽</span>
                        </button>
                        <img src="https://yookassa.ru/integration/simplepay/img/iokassa-gray.svg?v=1.34.0" class="ym-logo" width="114" height="27" alt="ЮKassa">
                    </div>
                </form>
            </div>
            
            <a href="profile.html" class="btn" style="display: block; text-align: center; margin-top: 20px; background: #ccc; color: #333;">📦 Перейти к заказам</a>
            <a href="index.html" class="btn" style="display: block; text-align: center; margin-top: 12px; background: #ccc; color: #333;">← На главную</a>
        `;
        
        var script = document.createElement('script');
        script.src = 'https://yookassa.ru/integration/simplepay/js/yookassa_construct_form.js?v=1.34.0';
        script.onload = function() {
            console.log('ЮKassa form script loaded');
            var sumInput = document.querySelector('.ym-sum-input');
            var priceOutput = document.querySelector('.ym-price-output');
            if (sumInput && priceOutput) {
                priceOutput.textContent = sumInput.value + ' ₽';
            }
        };
        document.body.appendChild(script);
    }
    
    function showError(message) {
        document.getElementById('loader').style.display = 'none';
        var container = document.getElementById('payment-content');
        container.style.display = 'block';
        container.innerHTML = `
            <div class="error-message">
                ${message}
            </div>
            <a href="index.html" class="btn" style="display: block; text-align: center;">← На главную</a>
        `;
    }
</script>
</body>
</html>
