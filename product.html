<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velvet — Товар</title>
<link rel="stylesheet" href="style.css">
<style>
.product-wrap {
  max-width: 1100px;
  margin: 60px auto;
  padding: 0 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
  position: relative;
}

.product-wrap::before {
  content: '';
  position: absolute;
  top: -50px;
  right: -50px;
  width: 250px;
  height: 250px;
  background: var(--primary-soft);
  border-radius: 50% 40% 60% 50% / 40% 60% 40% 60%;
  z-index: -1;
  opacity: 0.4;
}

.product-wrap img {
  width: 100%;
  border-radius: 32px;
  object-fit: cover;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
}

.product-details {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.product-details h1 {
  font-size: 36px;
  font-weight: 600;
  margin: 0;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.product-description {
  font-size: 16px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.product-price {
  font-size: 42px;
  font-weight: 700;
  color: var(--primary);
  margin: 8px 0;
}

.product-price small {
  font-size: 16px;
  font-weight: 400;
  color: var(--text-secondary);
}

.actions {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border: none;
  padding: 14px 32px;
  border-radius: 40px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  flex: 1;
  min-width: 160px;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(232, 95, 185, 0.3);
}

.btn-secondary {
  background: #f5f5f5;
  color: var(--text-main);
  border: none;
  padding: 14px 32px;
  border-radius: 40px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  flex: 1;
  min-width: 160px;
}

.btn-secondary:hover {
  background: #e8e8e8;
  transform: translateY(-2px);
}

.btn-back {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  padding: 14px 28px;
  border-radius: 40px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-back:hover {
  background: #f5f5f5;
  transform: translateY(-2px);
}

.loading, .error {
  text-align: center;
  padding: 80px;
  font-size: 18px;
}

.error {
  color: #ff4757;
}

@media (max-width: 768px) {
  .product-wrap {
    grid-template-columns: 1fr;
    margin: 30px auto;
    gap: 30px;
  }
  
  .product-details h1 {
    font-size: 28px;
  }
  
  .product-price {
    font-size: 34px;
  }
  
  .actions {
    flex-direction: column;
  }
  
  .btn-primary, .btn-secondary, .btn-back {
    width: 100%;
  }
}
</style>
</head>
<body>
<header>
  <div class="container">
    <div class="header-content">
      <div class="logo-wrapper">
        <span class="logo-text">Velvet</span>
      </div>
      <div style="position: relative; flex: 1; max-width: 400px;">
        <input type="text" id="search-input" class="header-search" placeholder="Найти десерт...">
      </div>
      <div class="header-right">
        <div class="header-icons">
          <button id="notifications-btn" aria-label="Уведомления">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span id="notifications-badge"></span>
          </button>
          <button id="open-basket" aria-label="Корзина">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span id="basket-counter"></span>
          </button>
        </div>
        <div class="burger-menu">
          <button class="burger-btn" aria-label="Меню">☰</button>
          <div class="burger-dropdown">
            <button id="profile-link-btn" style="display:none;">👤 Личный кабинет</button>
            <button id="admin-panel-btn" style="display:none;">⚙️ Админка</button>
            <button id="orders-btn" style="display:none;">📦 Заказы</button>
            <hr style="margin: 6px 0; border:0; border-top:1px solid #eee;">
            <button id="logout-btn" style="display:none; color:#ff4757;">🚪 Выйти</button>
            <button id="auth-btn" style="display:none;">🔑 Войти</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
<main class="product-wrap" id="product-container">
  <div class="loading">✨ Загрузка десерта...</div>
</main>
<script src="product.js"></script>
<script src="script.js"></script>
</body>
</html>
